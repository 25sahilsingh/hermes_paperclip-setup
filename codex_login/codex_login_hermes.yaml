---
- name: Install Codex and login in Hermes container
  hosts: servers
  become: true

  tasks:
    - name: Ensure uuid was provided
      ansible.builtin.assert:
        that:
          - uuid is defined
          - uuid | length > 0
        fail_msg: 'Please provide a UUID using -e "uuid=<container_uuid>"'

    - name: Install Codex CLI
      ansible.builtin.command:
        cmd: >
          docker exec hermes_{{ uuid }}
          npm install -g @openai/codex

    - name: Remove old login log
      ansible.builtin.command:
        cmd: docker exec hermes_{{ uuid }} rm -f /tmp/codex_login.log
      ignore_errors: true

    - name: Start Codex login asynchronously
      # Run as the 'hermes' user (not root) with HOME=/opt/data so the token is
      # written to /opt/data/.codex/auth.json — the location the hermes gateway
      # process actually reads, and a bind-mounted path that survives recreate.
      ansible.builtin.shell: >
        docker exec -u hermes -e HOME=/opt/data hermes_{{ uuid }}
        sh -c 'codex login --device-auth > /tmp/codex_login.log 2>&1'
      async: 1800
      poll: 0
      register: codex_login_job

    - name: Wait until device code appears
      ansible.builtin.command:
        cmd: docker exec hermes_{{ uuid }} cat /tmp/codex_login.log
      register: login_output
      retries: 30
      delay: 1
      until: >
        (login_output.stdout |
        regex_replace('\x1b\[[0-9;]*m', ''))
        is search('[A-Z0-9]{4}-[A-Z0-9]{5}')

    - name: Show login instructions
      ansible.builtin.debug:
        msg: >-
          Open https://auth.openai.com/codex/device
          and enter code {{
            login_output.stdout
            | regex_replace('\x1b\[[0-9;]*m', '')
            | regex_search('[A-Z0-9]{4}-[A-Z0-9]{5}')
          }}

    - name: Wait for user to complete login
      ansible.builtin.async_status:
        jid: "{{ codex_login_job.ansible_job_id }}"
      register: login_status
      until: login_status.finished
      retries: 1800
      delay: 1

    - name: Verify login succeeded
      ansible.builtin.fail:
        msg: "Codex login failed."
      when: login_status.rc != 0

    - name: Login completed
      ansible.builtin.debug:
        msg: "✅ Codex installed and login completed successfully."
