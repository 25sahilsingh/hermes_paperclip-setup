---

- name: Configure Claude OAuth token
  hosts: servers
  become: true

  vars:
    compose_dir: "/home/{{ username }}/user_projects/instance/{{ uuid }}"
    compose_file: "{{ compose_dir }}/docker-compose.yaml"

  tasks:
    - name: Ensure uuid was provided
      ansible.builtin.assert:
        that:
          - uuid is defined
          - uuid | length > 0
        fail_msg: 'Please provide -e "uuid=<uuid>"'

    - name: Ensure oauth_token was provided
      ansible.builtin.assert:
        that:
          - oauth_token is defined
          - oauth_token | length > 0
        fail_msg: 'Please provide -e "oauth_token=<token>"'

    - name: Verify compose file exists
      ansible.builtin.stat:
        path: "{{ compose_file }}"
      register: compose_stat

    - name: Fail if compose file does not exist
      ansible.builtin.fail:
        msg: "Compose file not found: {{ compose_file }}"
      when: not compose_stat.stat.exists

    - name: Update CLAUDE_CODE_OAUTH_TOKEN
      ansible.builtin.replace:
        path: "{{ compose_file }}"
        regexp: '^\s*CLAUDE_CODE_OAUTH_TOKEN:.*$'
        replace: '      CLAUDE_CODE_OAUTH_TOKEN: "{{ oauth_token }}"'

    - name: Recreate paperclip container
      ansible.builtin.command:
        cmd: docker compose up -d paperclip
        chdir: "{{ compose_dir }}"
